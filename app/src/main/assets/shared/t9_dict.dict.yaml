#
# Combined dictionary for the t9_pinyin (拼音九宫格) schema, built from the
# curated core of 雾凇拼音 (rime-ice, https://github.com/iDvel/rime-ice):
#   cn_dicts/8105    — 《通用规范汉字表》character table (single-char coverage)
#   cn_dicts/base    — curated everyday word list
#   cn_dicts/ext     — extended vocabulary (成语, less common words)
#   cn_dicts/tencent — Tencent word-vector corpus, rime-ice's own default
#                      inclusion (only cn_dicts/41448, the big char table, is
#                      truly opt-in upstream)
#   cn_dicts/others  — misc entries
#
# This matters specifically for T9: word-frequency in this dictionary is
# exactly what resolves which letter a digit "meant", so a bigger, better
# curated dictionary directly improves 9-key candidate accuracy.

---
name: t9_dict
version: "2026-07-12"
sort: by_weight
import_tables:
  - cn_dicts/8105
  - cn_dicts/base
  - cn_dicts/ext
  - cn_dicts/tencent
  - cn_dicts/others
...
