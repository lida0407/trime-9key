# Rime default settings
# encoding: utf-8
#
# trime-9key: concrete copy of prelude/default.yaml (was a symlink) so that
# the `t9_pinyin` (拼音九宫格) schema is listed in schema_list and therefore
# gets compiled on deploy — which is what lets `select_schema t9_pinyin`
# (the 9-key ⇄ qwerty switch keys) actually activate it.

config_version: '0.40'

schema_list:
  - schema: luna_pinyin
  - schema: t9_pinyin
  - schema: luna_pinyin_simp
  - schema: luna_pinyin_fluency
  - schema: bopomofo
  - schema: bopomofo_tw
  - schema: cangjie5
  - schema: stroke
  - schema: terra_pinyin

switcher:
  caption: 〔方案選單〕
  hotkeys:
    - Control+grave
    - Control+Shift+grave
    - F4
  save_options:
    - full_shape
    - ascii_punct
    - simplification
    - extended_charset
    - zh_hant
    - zh_hans
    - zh_hant_tw
  fold_options: true
  abbreviate_options: true
  option_list_separator: '／'

menu:
  page_size: 5

punctuator:
  full_shape:
    __include: punctuation:/full_shape
  half_shape:
    __include: punctuation:/half_shape

key_binder:
  bindings:
    __patch:
      - key_bindings:/emacs_editing
      - key_bindings:/move_by_word_with_tab
      - key_bindings:/paging_with_minus_equal
      - key_bindings:/paging_with_comma_period
      - key_bindings:/numbered_mode_switch

recognizer:
  patterns:
    email: "^[A-Za-z][-_.0-9A-Za-z]*@.*$"
    uppercase: "[A-Z][-_+.'0-9A-Za-z]*$"
    url: "^(www[.]|https?:|ftp[.:]|mailto:|file:).*$|^[a-z]+[.].+$"

ascii_composer:
  good_old_caps_lock: true
  # trime-9key: Shift/Caps never toggle English. The only way between
  # Chinese and English is the one mode key on the keyboard, which cycles
  # 九宫格 -> 全键拼音 -> 英文. (inline_ascii/commit_text/clear all flip
  # ascii_mode as a side effect; noop is the only value that doesn't.)
  switch_key:
    Shift_L: noop
    Shift_R: noop
    Control_L: noop
    Control_R: noop
    Caps_Lock: noop
    Eisu_toggle: clear
