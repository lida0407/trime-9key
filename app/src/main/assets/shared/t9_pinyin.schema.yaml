# Rime schema — 拼音九宫格 (T9) for Trime
# encoding: utf-8
#
# 真正的九宫格：键盘只发送数字 2-9（2=abc 3=def … 9=wxyz）。用户按下的
# 数字是「模糊」的——到底是这一键上的哪个字母，不由键盘决定，而是由下面
# speller/algebra 里的 `xlit` 把每个拼音音节整体转写成它的数字编码
# （例：ni → 64、hao → 426），再拿输入的数字序列去词库里匹配，候选按
# 词库词频排序。这正是 Google／搜狗等九宫格输入法的做法。
#
# 候选带完整带调拼音提示（translator/spelling_hints），所以虽然编码区
# 显示的是数字，候选项上仍能看到对应的拼音。
#
# 词库：t9_dict（见 t9_dict.dict.yaml），取自雾凇拼音（rime-ice）的字表 +
# 基础词库 + 扩展词库 + 杂项，比朙月拼音自带的词库大得多、更新更勤——
# T9 的候选质量完全取决于词频，词库越好，猜得越准。

schema:
  schema_id: t9_pinyin
  name: 拼音九宫格
  version: "0.3"
  author:
    - trime-9key
  description: |
    九宫格（T9）：键盘发送数字 2-9，候选由词库词频决定。
    词库来自雾凇拼音 (rime-ice) 的字表+基础+扩展+杂项词库。
  dependencies:
    - stroke

switches:
  - name: ascii_mode
    reset: 0
    states: [ 中文, 西文 ]
  - name: full_shape
    states: [ 半角, 全角 ]
  - name: simplification
    states: [ 漢字, 汉字 ]
  - name: ascii_punct
    states: [ 。，, ．， ]
  - name: emoji            # 输入词语时附带 emoji 候选（如 哈哈 → 😄）
    states: [ 无表情, 表情 ]
    reset: 1

engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - reverse_lookup_translator
    - script_translator
  filters:
    - simplifier@emoji     # 词语 → emoji 候选（雾凇 rime-ice 的 opencc/emoji.txt）
    - simplifier
    - uniquifier
    - lua_filter@*t9_preedit  # 编码区显示拼音而不是数字（见 lua/t9_preedit.lua）

speller:
  # 键盘发送的是数字 2-9，它们必须在 alphabet 里，speller 才会把它们当作
  # 编码来组词；否则数字会被当成普通字符直接上屏（就会「全是数字」）。
  alphabet: '23456789'
  delimiter: " '"
  algebra:
    # 先做常见的简拼 / 模糊音 / 纠错，得到各种字母拼写……
    - abbrev/^([a-z]).+$/$1/          # 简拼：取首字母
    - abbrev/^([zcs]h).+$/$1/         # zh/ch/sh 视为整体的简拼
    - derive/^([nl])ve$/$1ue/
    - derive/^([jqxy])u/$1v/
    - derive/un$/uen/
    - derive/ui$/uei/
    - derive/iu$/iou/
    - derive/([aeiou])ng$/$1gn/
    - derive/([dtngkhrzcs])o(u|ng)$/$1o/
    - derive/ong$/on/
    - derive/ao$/oa/
    - derive/([iu])a(o|ng?)$/a$1$2/
    # ……最后把 26 个字母整体转写成 T9 数字（一次性替换，保证生成完整的
    # 数字编码，如 ni → 64）。这一步必须放在最后。
    - xlit/abcdefghijklmnopqrstuvwxyz/22233344455566677778889999/

translator:
  dictionary: t9_dict            # 雾凇拼音(rime-ice)词库核心集，见 t9_dict.dict.yaml
  prism: t9_pinyin              # 单独编译数字编码的 prism
  spelling_hints: 16            # 候选标注完整带调拼音（九宫格的拼音提示）
  enable_sentence: true
  # 编码区不显示数字「64」，改显示拼音——由 lua/t9_preedit.lua 把每个候选的
  # preedit 覆盖成它的拼音（来自 spelling_hints 的 comment）。

# 词语 → emoji：复用雾凇拼音(rime-ice)的 opencc/emoji.txt 映射表
emoji:
  option_name: emoji
  opencc_config: emoji.json
  inherit_comment: false

reverse_lookup:
  dictionary: stroke
  enable_completion: true
  prefix: "`"
  suffix: "'"
  tips: 〔笔画〕

punctuator:
  import_preset: symbols

key_binder:
  import_preset: default

recognizer:
  import_preset: default
  patterns:
    reverse_lookup: "`[a-z]*'?$"
